<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Baan Mon Muan – Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6914;
  --black:#090700;--dark:#100F06;--dark2:#191508;--dark3:#221D09;
  --text:#F0E8D0;--dim:#9A8A60;
  --b:rgba(201,168,76,.2);--b2:rgba(201,168,76,.5);
  --pending:#E8A84C;--preparing:#4CA8E8;--ready:#4CE8A8;--served:#6A6858;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--black);color:var(--text);font-family:'Sarabun',sans-serif;display:flex;flex-direction:column}

.topbar{flex-shrink:0;height:58px;background:var(--dark);border-bottom:2px solid var(--gold-d);display:flex;align-items:center;gap:12px;padding:0 16px}
.tb-logo{font-family:'Cinzel';font-size:clamp(13px,3vw,18px);font-weight:700;background:linear-gradient(135deg,var(--gold-l),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;flex-shrink:0}
.tb-sub{font-size:10px;color:var(--dim);letter-spacing:2px;white-space:nowrap;display:none}
@media(min-width:500px){.tb-sub{display:block}}
.clock{font-family:'Cinzel';font-size:clamp(14px,4vw,22px);color:var(--gold-l);letter-spacing:2px;margin-left:auto;white-space:nowrap;flex-shrink:0}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4CE8A8;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nbtn{background:none;border:1px solid var(--b2);color:var(--gold);padding:6px 12px;border-radius:6px;font-family:'Sarabun';font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;flex-shrink:0}
.nbtn:active{background:rgba(201,168,76,.15)}

/* TABS */
.stbar{flex-shrink:0;background:var(--dark2);border-bottom:1px solid var(--b);display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stbar::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:0 14px;height:44px;background:none;border:none;border-bottom:3px solid transparent;color:var(--dim);font-family:'Sarabun';font-size:clamp(11px,2.5vw,13px);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:color .15s,border-color .15s}
.stab.on{color:var(--text);border-bottom-color:var(--gold)}
.sbadge{font-size:10px;background:var(--dark3);border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.sbadge.hot{background:var(--gold);color:var(--black);font-weight:700;animation:badgePop .3s ease}
@keyframes badgePop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* VIEW TOGGLE */
.vbar{flex-shrink:0;background:var(--dark3);border-bottom:1px solid var(--b);padding:8px 16px;display:flex;gap:8px;align-items:center}
.vbtn{background:none;border:1px solid var(--b);color:var(--dim);padding:5px 14px;border-radius:20px;font-size:12px;font-family:'Sarabun';cursor:pointer;transition:all .15s}
.vbtn.on{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--gold-l)}
.vbar-lbl{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-right:4px;flex-shrink:0}

/* BOARD - ORDER CARDS VIEW */
.board{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch;
  display:grid;gap:12px;align-content:start;
  grid-template-columns:1fr;
  grid-auto-rows:170px}
@media(min-width:600px){.board{grid-template-columns:repeat(2,1fr);grid-auto-rows:210px}}
@media(min-width:900px){.board{grid-template-columns:repeat(3,1fr);grid-auto-rows:240px}}
@media(min-width:1200px){.board{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--dark2);border:1px solid var(--b);border-radius:12px;overflow:hidden;animation:fadeUp .25s ease;transition:border-color .15s}
.card:hover{border-color:var(--b2)}
.card.new-order{border-color:var(--gold);box-shadow:0 0 16px rgba(201,168,76,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.urgent{animation:urgentFlash 1s ease infinite}
@keyframes urgentFlash{0%,100%{border-color:var(--b)}50%{border-color:#E88080;box-shadow:0 0 12px rgba(232,80,80,.4)}}

.ch{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--dark3);border-bottom:1px solid var(--b);flex-wrap:wrap;row-gap:4px}
.ch-id{font-family:'Cinzel';font-size:clamp(13px,3vw,15px);color:var(--gold-l);font-weight:700}
.ch-tbl{background:rgba(201,168,76,.12);border:1px solid var(--b);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--dim);white-space:nowrap}
.ch-tbl b{color:var(--gold);font-family:'Cinzel';font-size:13px}
.ch-time{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap}
.ch-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.pill-pending{background:rgba(232,168,76,.15);color:var(--pending);border:1px solid rgba(232,168,76,.4)}
.pill-preparing{background:rgba(76,168,232,.15);color:var(--preparing);border:1px solid rgba(76,168,232,.4)}
.pill-ready{background:rgba(76,232,168,.15);color:var(--ready);border:1px solid rgba(76,232,168,.4)}
.pill-served{background:rgba(106,104,88,.15);color:var(--served);border:1px solid rgba(106,104,88,.35)}
.pill-paid{background:rgba(60,180,60,.12);color:#4CD88A;border:1px solid rgba(60,180,60,.3)}
.elapsed{font-family:'Cinzel';font-size:10px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.elapsed.ok{background:rgba(76,232,168,.1);color:var(--ready);border:1px solid rgba(76,232,168,.25)}
.elapsed.warn{background:rgba(232,80,80,.2);color:#E88080;border:1px solid rgba(232,80,80,.35)}

.citems{padding:10px 14px}
.oi{display:flex;align-items:baseline;gap:7px;padding:5px 0;border-bottom:1px solid rgba(201,168,76,.07)}
.oi:last-child{border:none}
.oi.cancelled{opacity:.35;text-decoration:line-through}
.oi-q{font-family:'Cinzel';font-size:13px;color:var(--gold);min-width:22px;text-align:center;background:rgba(201,168,76,.1);border-radius:4px;padding:1px 3px;flex-shrink:0}
.oi-n{font-size:clamp(12px,2.5vw,14px);color:var(--text);flex:1;min-width:0}
.oi-nth{font-size:11px;color:var(--dim)}
.oi-sub{font-size:10px;color:var(--dim);font-style:italic}
.oi-p{font-family:'Cinzel';font-size:11px;color:var(--dim);white-space:nowrap;flex-shrink:0}
.cnote{margin:4px 14px;background:rgba(201,168,76,.05);border:1px solid var(--b);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--dim);font-style:italic}
/* Card footer (mini — no action buttons on card) */
.cfoot-mini{padding:8px 14px;border-top:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cftotal{font-family:'Cinzel';font-size:13px;color:var(--dim);flex-shrink:0}
.cftotal span{color:var(--gold-l)}
.cfoot-hint{font-size:10px;color:var(--dim);font-style:italic;opacity:.7}
/* Removed inline action buttons from card — now in popup only */
.oi-more{padding:5px 0 2px;font-size:11px;color:var(--gold-d);font-style:italic;letter-spacing:.3px}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--gold-d)}
.card.clickable:active{opacity:.92}
/* Popup action buttons */
.btn-start-pop{background:linear-gradient(135deg,#1A4A8A,var(--preparing));color:#fff;border:none}
.btn-ready-pop{background:linear-gradient(135deg,#1A6A4A,var(--ready));color:var(--black);border:none}
.btn-served-pop{background:linear-gradient(135deg,#3A3A28,#7A7860);color:var(--text);border:none}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;grid-column:1/-1;color:var(--dim)}
.empty-ico{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-txt{font-family:'Cinzel';font-size:clamp(13px,3vw,16px);letter-spacing:1px}

.statsbar{flex-shrink:0;background:var(--dark3);border-top:1px solid var(--b);padding:7px 16px;display:flex;flex-wrap:wrap;gap:16px;row-gap:4px}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.slbl{font-size:11px;color:var(--dim)}
.sval{font-family:'Cinzel';font-size:14px}

.bell-btn{background:none;border:1px solid var(--b);color:var(--dim);padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;flex-shrink:0}
.bell-btn.on{border-color:var(--gold);color:var(--gold)}

/* TABLE VIEW */
.table-board{flex:1;overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start;grid-template-columns:repeat(2,1fr)}
@media(min-width:480px){.table-board{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.table-board{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.table-board{grid-template-columns:repeat(5,1fr)}}
.tcard{background:var(--dark2);border:1px solid var(--b);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .15s;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:90px}
.tcard:hover{border-color:var(--b2);background:var(--dark3)}
.tcard:hover .tcard-hint{opacity:1}
.tcard.active{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,.2)}
.tcard.empty{border-style:dashed;opacity:.4;text-align:center;align-items:center;justify-content:center}
.tcard-top{display:flex;align-items:center;gap:8px}
.tcard-num{font-family:'Cinzel';font-size:18px;color:var(--gold-l);flex-shrink:0}
.tcard-lbl{font-size:9px;color:var(--dim);letter-spacing:2px;flex-shrink:0}
.tcard-orders{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap;flex-shrink:0}
.tcard-status{display:flex;gap:4px;flex-wrap:wrap}
.ts-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* Item preview list */
.tcard-items{display:flex;flex-direction:column;gap:2px;flex:1}
.tci{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--text);line-height:1.4;overflow:hidden}
.tci-q{font-family:'Cinzel';font-size:10px;color:var(--gold);background:rgba(201,168,76,.12);border-radius:3px;padding:0 3px;flex-shrink:0;white-space:nowrap}
.tci-n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tci-more{font-size:10px;color:var(--dim);font-style:italic;padding-left:2px}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.tcard-total{font-family:'Cinzel';font-size:13px;color:var(--gold-l)}
.tcard-hint{font-size:10px;color:var(--dim);opacity:0;transition:opacity .15s;white-space:nowrap}

/* TABLE DETAIL POPUP (scrollable) */
.tdpop-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:flex-end;justify-content:center}
.tdpop-bg.on{display:flex}
@media(min-width:640px){.tdpop-bg{align-items:center;padding:20px}}
.tdpop{background:var(--dark);border:1px solid var(--b2);border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@media(min-width:640px){.tdpop{border-radius:16px;max-height:85vh;animation:fadeIn .2s ease}}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.tdpop-head{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;flex-shrink:0}
.tdpop-title{font-family:'Cinzel';font-size:17px;color:var(--gold-l);flex:1}
.tdpop-close{background:none;border:1px solid var(--b);color:var(--dim);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tdpop-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.tdpop-order{background:var(--dark2);border:1px solid var(--b);border-radius:10px;margin-bottom:12px;overflow:hidden}
.tdpop-oh{padding:8px 12px;background:var(--dark3);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdpop-oid{font-family:'Cinzel';font-size:13px;color:var(--gold)}
.tdpop-otime{font-size:11px;color:var(--dim);margin-left:auto}
.tdpop-items{padding:8px 12px}
.tdpop-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(201,168,76,.07)}
.tdpop-item:last-child{border:none}
.tdpop-item.cancelled{opacity:.3;text-decoration:line-through}
.tdi-qty{font-family:'Cinzel';font-size:12px;color:var(--gold);background:rgba(201,168,76,.1);border-radius:4px;padding:1px 5px;min-width:24px;text-align:center;flex-shrink:0}
.tdi-name{flex:1;font-size:13px}
.tdi-sub{font-size:10px;color:var(--dim);font-style:italic}
.tdi-price{font-family:'Cinzel';font-size:11px;color:var(--dim);white-space:nowrap}
.tdi-cancel{background:rgba(232,76,76,.1);border:1px solid rgba(232,76,76,.3);color:#E88080;padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:'Sarabun';white-space:nowrap;flex-shrink:0}
.tdi-cancel:active{background:rgba(232,76,76,.25)}
.tdpop-note{margin:0 12px 8px;background:rgba(201,168,76,.05);border:1px solid var(--b);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--dim);font-style:italic}
.tdpop-ofoot{padding:8px 12px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:center}
.tdpop-ototal{font-family:'Cinzel';font-size:12px;color:var(--dim);flex:1}
.tdpop-ototal span{color:var(--gold-l)}
.tdpop-foot{padding:12px 14px;border-top:1px solid var(--b);display:flex;gap:10px;flex-shrink:0}
.tdf-btn{flex:1;padding:11px;border:none;border-radius:10px;font-family:'Sarabun';font-size:14px;font-weight:700;cursor:pointer}
.tdf-paid{background:linear-gradient(135deg,#1A5A2A,#4CD88A);color:var(--black)}
.tdf-close{background:none;border:1px solid var(--b);color:var(--dim)}
.tdf-total{text-align:center;font-family:'Cinzel';font-size:16px;color:var(--gold-l);padding:8px 0}
.tdf-note{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
</style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <div class="tb-logo">BAAN MON MUAN</div>
    <div class="tb-sub">KITCHEN DASHBOARD</div>
  </div>
  <div class="live-dot" title="Live"></div>
  <div class="clock" id="clock">00:00:00</div>
  <button class="bell-btn" id="bellBtn" onclick="toggleBell()" title="Sound alert">🔔</button>
  <button class="nbtn" onclick="render()">⟳</button>
  <a href="index.html" class="nbtn">Menu</a>
</div>

<div class="stbar">
  <button class="stab on" onclick="setF('current',this)">⚡ CURRENT ORDER <span class="sbadge" id="b_current">0</span></button>
  <button class="stab" onclick="setF('pending',this)">🔴 NEW <span class="sbadge" id="b_pending">0</span></button>
  <button class="stab" onclick="setF('preparing',this)">🔵 PREPARING <span class="sbadge" id="b_preparing">0</span></button>
  <button class="stab" onclick="setF('ready',this)">🟢 READY <span class="sbadge" id="b_ready">0</span></button>
  <button class="stab" onclick="setF('served',this)">✅ SERVED <span class="sbadge" id="b_served">0</span></button>
  <button class="stab" onclick="setF('paid',this)">💳 PAID <span class="sbadge" id="b_paid">0</span></button>
  <button class="stab" onclick="setF('all',this)">ALL <span class="sbadge" id="b_all">0</span></button>
</div>

<div class="vbar">
  <span class="vbar-lbl">View:</span>
  <button class="vbtn on" id="vOrders" onclick="setView('orders')">📋 Orders</button>
  <button class="vbtn" id="vTables" onclick="setView('tables')">🍽️ By Table</button>
</div>

<div class="board" id="board"></div>
<div class="table-board" id="tableboard" style="display:none"></div>

<!-- TABLE DETAIL POPUP -->
<div class="tdpop-bg" id="tdpopBg" onclick="closeTdPop(event)">
  <div class="tdpop" id="tdpop">
    <div class="tdpop-head">
      <div class="tdpop-title" id="tdpopTitle">Table —</div>
      <button class="tdpop-close" onclick="closeTdPopBtn()">✕</button>
    </div>
    <div class="tdpop-body" id="tdpopBody"></div>
    <div class="tdpop-foot" id="tdpopFoot">
      <div style="flex:1">
        <div class="tdf-total" id="tdpopTotal">฿0</div>
        <div class="tdf-note" id="tdpopNote">Table total</div>
      </div>
      <button class="tdf-btn tdf-paid" id="tdpopPayBtn" onclick="markTablePaid()" style="display:none">💳 Confirm Payment & Clear</button>
    </div>
  </div>
</div>

<div class="statsbar">
  <div class="stat"><div class="sdot" style="background:var(--pending)"></div><span class="slbl">Pending</span><span class="sval" id="sv_p" style="color:var(--pending)">0</span></div>
  <div class="stat"><div class="sdot" style="background:var(--preparing)"></div><span class="slbl">Preparing</span><span class="sval" id="sv_pr" style="color:var(--preparing)">0</span></div>
  <div class="stat"><div class="sdot" style="background:var(--ready)"></div><span class="slbl">Ready</span><span class="sval" id="sv_r" style="color:var(--ready)">0</span></div>
  <div class="stat" style="margin-left:auto"><span class="slbl">Today</span><span class="sval" id="sv_t" style="color:var(--gold)">0</span></div>
  <div class="stat"><span class="slbl">Revenue</span><span class="sval" id="sv_rev" style="color:var(--gold-l)">฿0</span></div>
</div>

<script>
'use strict';
let filter='current';
let prevIds=new Set();
let bellOn=true;
let lastPendingCount=0;
let viewMode='orders'; // 'orders' or 'tables'
let activeTdTable=null;

// ── FIREBASE CONFIG (fill in your project values) ──
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDkyydLHfUmZukZsWVbZ343aeYIGk54XCg",
  authDomain: "baan-mon-muan-f4ad5.firebaseapp.com",
  databaseURL: "https://baan-mon-muan-f4ad5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baan-mon-muan-f4ad5",
  storageBucket: "baan-mon-muan-f4ad5.appspot.com",
  messagingSenderId: "731587450487",
  appId: "1:731587450487:web:d47e30f298a95e5dd4d872"
};
firebase.initializeApp(FIREBASE_CONFIG);
const _db = firebase.database();

// ── STORAGE (Firebase Realtime Database — shared across all devices) ──
let _ordersCache = [];
let _salesCache  = [];
let _prevOrderIds = new Set();

_db.ref('bmm_orders').on('value', snap => {
  const newOrders = snap.val() ? Object.values(snap.val()) : [];
  const hasNew = newOrders.some(o => o.status === 'pending' && !_prevOrderIds.has(o.id));
  _prevOrderIds = new Set(newOrders.map(o => o.id));
  _ordersCache = newOrders;
  if(hasNew) playBell();
  render();
});
_db.ref('bmm_sales').on('value', snap => {
  _salesCache = snap.val() ? Object.values(snap.val()) : [];
  render();
});

function loadOrders(){ return _ordersCache; }
function loadSales(){ return _salesCache; }
function saveOrders(orders){
  const obj = {};
  orders.forEach(o => { if(o && o.id) obj[o.id.replace(/[.#$\[\]]/g,'_')] = o; });
  _db.ref('bmm_orders').set(obj);
}
function saveSales(s){
  const arr = Array.isArray(s) ? s : Object.values(s);
  const obj = {};
  arr.forEach(x => { if(x && x.id) obj[x.id.replace(/[.#$\[\]]/g,'_')] = x; });
  _db.ref('bmm_sales').set(obj);
}


setInterval(render,30000); // fallback

function toggleBell(){
  bellOn=!bellOn;
  document.getElementById('bellBtn').className='bell-btn'+(bellOn?' on':'');
}

function playBell(){
  if(!bellOn)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+.3);
    g.gain.setValueAtTime(.4,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
    o.start();o.stop(ctx.currentTime+.5);
  }catch(e){}
}

function setF(f,el){
  filter=f;
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  render();
}

function setView(v){
  viewMode=v;
  document.getElementById('vOrders').classList.toggle('on',v==='orders');
  document.getElementById('vTables').classList.toggle('on',v==='tables');
  document.getElementById('board').style.display=v==='orders'?'grid':'none';
  document.getElementById('tableboard').style.display=v==='tables'?'grid':'none';
  render();
}

function elapsedMins(iso){return Math.floor((Date.now()-new Date(iso))/60000);}

function pill(s){
  const m={pending:['pill-pending','🔴 New'],preparing:['pill-preparing','🔵 Prep'],ready:['pill-ready','🟢 Ready'],served:['pill-served','✅ Served'],paid:['pill-paid','💳 Paid']};
  const[c,l]=m[s]||m.pending;
  return'<span class="pill '+c+'">'+l+'</span>';
}

function actionBtn(o){
  if(o.status==='pending')return'<button class="actbtn btn-start" onclick="upd(\''+o.id+'\',\'preparing\')">▶ Start Cooking</button>';
  if(o.status==='preparing')return'<button class="actbtn btn-ready" onclick="upd(\''+o.id+'\',\'ready\')">✓ Mark Ready</button>';
  if(o.status==='ready')return'<button class="actbtn btn-served" onclick="upd(\''+o.id+'\',\'served\')">🍽 Mark Served</button><button class="actbtn btn-table" onclick="openTdPop('+o.table+')">Table '+o.table+'</button>';
  if(o.status==='served')return'<button class="actbtn btn-table" onclick="openTdPop('+o.table+')">💳 Checkout Tbl '+o.table+'</button>';
  return'<span class="btn-done">Completed</span>';
}

function render(){
  const orders=loadOrders();
  const today=new Date().toDateString();
  const tod=orders.filter(o=>new Date(o.time).toDateString()===today);

  const cnt={all:0,current:0,pending:0,preparing:0,ready:0,served:0,paid:0};
  tod.forEach(o=>{
    cnt.all++;
    if(cnt[o.status]!==undefined)cnt[o.status]++;
    if(o.status==='preparing'||o.status==='ready'||o.status==='served')cnt.current++;
  });

  if(cnt.pending>lastPendingCount)playBell();
  lastPendingCount=cnt.pending;

  Object.keys(cnt).forEach(k=>{
    const el=document.getElementById('b_'+k);
    if(el){el.textContent=cnt[k];el.className='sbadge'+(k!=='all'&&cnt[k]>0?' hot':'');}
  });

  document.getElementById('sv_p').textContent=cnt.pending;
  document.getElementById('sv_pr').textContent=cnt.preparing;
  document.getElementById('sv_r').textContent=cnt.ready;
  document.getElementById('sv_t').textContent=tod.length;
  
  const sales=loadSales();
  const todaySales=sales.filter(s=>new Date(s.paidAt).toDateString()===today);
  const rev=todaySales.reduce((s,o)=>s+o.total,0);
  document.getElementById('sv_rev').textContent='฿'+rev;

  if(viewMode==='orders')renderOrders(tod);
  else renderTables(tod);
}

function renderOrders(tod){
  const pri={pending:0,preparing:1,ready:2,served:3,paid:4};
  const list=(
    filter==='all'?tod:
    filter==='current'?tod.filter(o=>o.status==='preparing'||o.status==='ready'||o.status==='served'):
    tod.filter(o=>o.status===filter)
  ).sort((a,b)=>pri[a.status]-pri[b.status]||new Date(a.time)-new Date(b.time));

  const board=document.getElementById('board');
  board.innerHTML='';
  if(!list.length){
    const emptyMsg={all:'No orders today yet',current:'No active orders',paid:'No paid orders today'}[filter]||('No '+filter+' orders');
    board.innerHTML='<div class="empty"><div class="empty-ico">🍽️</div><div class="empty-txt">'+emptyMsg+'</div></div>';
    return;
  }

  const PREVIEW=3;
  const newIds=new Set(list.map(o=>o.id));
  list.forEach(o=>{
    const mins=elapsedMins(o.time);
    const isNew=!prevIds.has(o.id)&&o.status==='pending';
    const isUrgent=mins>20&&o.status!=='served'&&o.status!=='paid';
    const div=document.createElement('div');
    div.className='card clickable'+(isNew?' new-order':isUrgent?' urgent':'');
    div.onclick=()=>openOrderPop(o.id);

    const activeItems=o.items.filter(it=>!it.cancelled);
    const total=activeItems.reduce((s,it)=>s+it.price*it.qty,0);
    const preview=activeItems.slice(0,PREVIEW);
    const extra=activeItems.length-PREVIEW;

    const previewHtml=preview.map(it=>{
      const sub=it.displayLabel?'<div class="oi-sub">'+it.displayLabel.trim()+'</div>':'';
      return'<div class="oi"><span class="oi-q">'+it.qty+'</span><span class="oi-n">'+it.name+sub+'<div class="oi-nth">'+it.nameTh+'</div></span><span class="oi-p">฿'+it.price*it.qty+'</span></div>';
    }).join('');
    const moreHtml=extra>0?'<div class="oi-more">+'+extra+' more item'+(extra>1?'s':'')+'  ·  tap to see all</div>':'';

    div.innerHTML=
      '<div class="ch">'
      +'<div><div class="ch-id">'+o.id+'</div></div>'
      +'<div class="ch-tbl">Table <b>'+o.table+'</b></div>'
      +'<div class="ch-time">'+o.timeStr+'</div>'
      +'<div class="ch-right">'+pill(o.status)+(o.status!=='served'&&o.status!=='paid'?'<span class="elapsed '+(mins>20?'warn':'ok')+'">'+mins+'m</span>':'')+'</div>'
      +'</div>'
      +'<div class="citems">'+previewHtml+moreHtml+'</div>'
      +(o.note?'<div class="cnote">📝 '+o.note+'</div>':'')
      +'<div class="cfoot-mini"><span class="cftotal">฿<span>'+total+'</span></span><span class="cfoot-hint">Tap for details & actions ›</span></div>';
    board.appendChild(div);
  });
  prevIds=newIds;
}

function openOrderPop(orderId){
  const orders=loadOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;
  activeTdTable=o.table; // reuse existing popup infra
  // Build single-order popup
  const body=document.getElementById('tdpopBody');
  document.getElementById('tdpopTitle').textContent=o.id+'  ·  Table '+o.table;
  body.innerHTML='';

  const activeItems=o.items.filter(it=>!it.cancelled);
  const total=activeItems.reduce((s,it)=>s+it.price*it.qty,0);
  const mins=elapsedMins(o.time);

  const div=document.createElement('div');
  div.className='tdpop-order';
  div.innerHTML=
    '<div class="tdpop-oh">'    +pill(o.status)    +'<span class="tdpop-otime">'+o.timeStr+'  ·  '+mins+'m ago</span>'    +'</div>'    +'<div class="tdpop-items">'    +o.items.map(it=>{
      const sub=it.displayLabel?'<div class="tdi-sub">'+it.displayLabel.trim()+'</div>':'';
      const cancelBtn=!it.cancelled
        ?'<button class="tdi-cancel" onclick="cancelItemSingle(event,\''+o.id+'\',\''+encodeURIComponent(it.name)+'\')">✕ Cancel</button>'
        :'<span style="font-size:10px;color:#E88080">Cancelled</span>';
      return'<div class="tdpop-item'+(it.cancelled?' cancelled':'')+'">'        +'<span class="tdi-qty">'+it.qty+'</span>'        +'<div style="flex:1"><div class="tdi-name">'+it.name+sub+'</div><div class="tdi-sub">'+it.nameTh+'</div></div>'        +'<span class="tdi-price">฿'+it.price*it.qty+'</span>'        +cancelBtn        +'</div>';
    }).join('')    +'</div>'    +(o.note?'<div class="tdpop-note">📝 '+o.note+'</div>':'');

  // Action buttons
  let actionHtml='';
  if(o.status==='pending')  actionHtml='<button class="tdf-btn btn-start-pop" onclick="updFromPopSingle(event,\''+o.id+'\',\'preparing\')">▶ Start Cooking</button>';
  if(o.status==='preparing')actionHtml='<button class="tdf-btn btn-ready-pop" onclick="updFromPopSingle(event,\''+o.id+'\',\'ready\')">✓ Mark Ready</button>';
  if(o.status==='ready')    actionHtml='<button class="tdf-btn btn-served-pop" onclick="updFromPopSingle(event,\''+o.id+'\',\'served\')">🍽 Mark Served</button>';
  if(o.status==='served')   actionHtml='<button class="tdf-btn tdf-paid" onclick="markTablePaid()">💳 Checkout Table '+o.table+'</button>';

  div.innerHTML+=actionHtml?'<div style="padding:10px 12px">'+actionHtml+'</div>':'';
  body.appendChild(div);

  document.getElementById('tdpopTotal').textContent='฿'+total;
  document.getElementById('tdpopPayBtn').style.display=o.status==='served'?'flex':'none';
  document.getElementById('tdpopBg').classList.add('on');
}

function cancelItemSingle(e,orderId,encodedName){
  e.stopPropagation();
  const itemName=decodeURIComponent(encodedName);
  if(!confirm('Cancel "'+itemName+'"?\n(Out of stock)'))return;
  const orders=loadOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;
  const it=o.items.find(i=>i.name===itemName&&!i.cancelled);
  if(it)it.cancelled=true;
  saveOrders(orders);
  openOrderPop(orderId); // refresh popup
  render();
}

function updFromPopSingle(e,id,status){
  e.stopPropagation();
  const orders=loadOrders();
  const o=orders.find(x=>x.id===id);
  if(o){o.status=status;saveOrders(orders);}
  openOrderPop(id); // refresh popup
  render();
}

function renderTables(tod){
  const tb=document.getElementById('tableboard');
  tb.innerHTML='';
  for(let t=1;t<=10;t++){
    const orders=tod.filter(o=>o.table===t&&o.status!=='paid');
    const div=document.createElement('div');

    if(!orders.length){
      div.className='tcard empty';
      div.innerHTML='<div class="tcard-num">'+t+'</div><div class="tcard-lbl">TABLE</div>';
      tb.appendChild(div);
      continue;
    }

    div.className='tcard active';
    div.onclick=()=>openTdPop(t);

    // Status dots
    const statusCounts={pending:0,preparing:0,ready:0,served:0};
    orders.forEach(o=>{if(statusCounts[o.status]!==undefined)statusCounts[o.status]++;});
    const dots=Object.entries(statusCounts)
      .filter(([,n])=>n>0)
      .map(([s,n])=>'<span class="ts-dot" style="background:var(--'+s+')" title="'+n+' '+s+'"></span>').join('');

    const total=orders.reduce((s,o)=>s+o.items.filter(i=>!i.cancelled).reduce((ss,i)=>ss+i.price*i.qty,0),0);
    const orderCount=orders.length;

    // Collect all active items across orders (merge same item+options)
    const itemMap={};
    orders.forEach(o=>{
      o.items.filter(i=>!i.cancelled).forEach(it=>{
        const key=(it.itemId||it.name)+(it.displayLabel||'');
        if(!itemMap[key])itemMap[key]={name:it.name,qty:0,label:it.displayLabel||''};
        itemMap[key].qty+=it.qty;
      });
    });
    const allItems=Object.values(itemMap);
    const PREVIEW=3;
    const preview=allItems.slice(0,PREVIEW);
    const extra=allItems.length-PREVIEW;

    const itemsHtml=preview.map(it=>{
      const sub=it.label?'<span style="color:var(--dim);font-size:9px"> '+it.label.trim()+'</span>':'';
      return'<div class="tci"><span class="tci-q">'+it.qty+'×</span><span class="tci-n">'+it.name+sub+'</span></div>';
    }).join('')
    +(extra>0?'<div class="tci"><span class="tci-more">+'+extra+' more item'+(extra>1?'s':'')+'…</span></div>':'');

    div.innerHTML=
      '<div class="tcard-top">'
        +'<span class="tcard-num">'+t+'</span>'
        +'<span class="tcard-lbl">TABLE</span>'
        +'<span style="margin-left:auto;display:flex;gap:4px">'+dots+'</span>'
      +'</div>'
      +'<div class="tcard-items">'+itemsHtml+'</div>'
      +'<div class="tcard-foot">'
        +'<span class="tcard-total">฿'+total+'</span>'
        +'<span class="tcard-hint">tap for details ›</span>'
        +'<span style="font-size:10px;color:var(--dim)">'+orderCount+' order'+(orderCount>1?'s':'')+'</span>'
      +'</div>';

    tb.appendChild(div);
  }
}

function openTdPop(tbl){
  activeTdTable=tbl;
  document.getElementById('tdpopTitle').textContent='Table '+tbl+' — Orders';
  renderTdPop(tbl);
  document.getElementById('tdpopBg').classList.add('on');
}
function closeTdPop(e){if(e.target===document.getElementById('tdpopBg'))closeTdPopBtn();}
function closeTdPopBtn(){document.getElementById('tdpopBg').classList.remove('on');activeTdTable=null;}

function renderTdPop(tbl){
  const orders=loadOrders();
  const today=new Date().toDateString();
  const tableOrders=orders.filter(o=>o.table===tbl&&new Date(o.time).toDateString()===today&&o.status!=='paid');
  const body=document.getElementById('tdpopBody');
  body.innerHTML='';

  if(!tableOrders.length){
    body.innerHTML='<div style="text-align:center;padding:30px;color:var(--dim)">No active orders for this table</div>';
    document.getElementById('tdpopTotal').textContent='฿0';
    document.getElementById('tdpopPayBtn').disabled=true;
    return;
  }

  let grandTotal=0;
  tableOrders.forEach(o=>{
    const activeItems=o.items.filter(it=>!it.cancelled);
    const orderTotal=activeItems.reduce((s,it)=>s+it.price*it.qty,0);
    grandTotal+=orderTotal;
    const div=document.createElement('div');
    div.className='tdpop-order';
    div.innerHTML=
      '<div class="tdpop-oh">'
      +'<span class="tdpop-oid">'+o.id+'</span>'
      +pill(o.status)
      +'<span class="tdpop-otime">'+o.timeStr+'</span>'
      +'</div>'
      +'<div class="tdpop-items">'
      +o.items.map(it=>{
        const subLabel=it.displayLabel?'<div class="tdi-sub">'+it.displayLabel.trim()+'</div>':'';
        const cancelBtn=!it.cancelled?'<button class="tdi-cancel" onclick="cancelItem(\''+o.id+'\',\''+it.itemId+'\',\''+it.name.replace(/'/g,"\\'")+'\')" title="Cancel – item out of stock">✕ Cancel</button>':'<span style="font-size:10px;color:#E88080">Cancelled</span>';
        return'<div class="tdpop-item'+(it.cancelled?' cancelled':'')+'">'
          +'<span class="tdi-qty">'+it.qty+'</span>'
          +'<div style="flex:1"><div class="tdi-name">'+it.name+subLabel+'</div><div class="tdi-sub">'+it.nameTh+'</div></div>'
          +'<span class="tdi-price">฿'+it.price*it.qty+'</span>'
          +(o.status!=='served'?cancelBtn:'')
          +'</div>';
      }).join('')
      +'</div>'
      +(o.note?'<div class="tdpop-note">📝 '+o.note+'</div>':'')
      +'<div class="tdpop-ofoot"><div class="tdpop-ototal">Total: <span>฿'+orderTotal+'</span></div>'
      +(o.status==='pending'?'<button class="actbtn btn-start" style="flex:none;padding:6px 12px;font-size:12px" onclick="updFromPop(\''+o.id+'\',\'preparing\')">▶ Start</button>':'')
      +(o.status==='preparing'?'<button class="actbtn btn-ready" style="flex:none;padding:6px 12px;font-size:12px" onclick="updFromPop(\''+o.id+'\',\'ready\')">✓ Ready</button>':'')
      +(o.status==='ready'?'<button class="actbtn btn-served" style="flex:none;padding:6px 12px;font-size:12px" onclick="updFromPop(\''+o.id+'\',\'served\')">🍽 Served</button>':'')
      +'</div>';
    body.appendChild(div);
  });

  document.getElementById('tdpopTotal').textContent='฿'+grandTotal;
  document.getElementById('tdpopPayBtn').disabled=false;
}

// Cancel a specific item in an order (out of stock)
function cancelItem(orderId,itemKey,itemName){
  if(!confirm('Cancel "'+itemName+'" from order '+orderId+'?\n(Item out of stock)'))return;
  const orders=loadOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;
  // Match by itemId or name
  const it=o.items.find(i=>(i.itemId||i.catId+i.name)===itemKey||i.name===itemName);
  if(it)it.cancelled=true;
  saveOrders(orders);
  renderTdPop(activeTdTable);
  render();
}

function updFromPop(id,status){
  const orders=loadOrders();
  const o=orders.find(x=>x.id===id);
  if(o){o.status=status;saveOrders(orders);}
  renderTdPop(activeTdTable);
  render();
}

// Mark all active table orders as paid → move to sales history → clear from active
function markTablePaid(){
  if(!activeTdTable)return;
  const orders=loadOrders();
  const today=new Date().toDateString();
  const tableOrders=orders.filter(o=>o.table===activeTdTable&&new Date(o.time).toDateString()===today&&o.status!=='paid');
  if(!tableOrders.length)return;
  const total=tableOrders.reduce((s,o)=>s+o.items.filter(i=>!i.cancelled).reduce((ss,i)=>ss+i.price*i.qty,0),0);
  if(!confirm('Confirm payment of ฿'+total+' for Table '+activeTdTable+'?\n\nThis will clear all orders for this table.'))return;
  
  const now=new Date();
  const sales=loadSales();
  const saleRecord={
    id:'PAY'+now.getFullYear().toString().slice(-2)+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(sales.length+1).padStart(3,'0'),
    table:activeTdTable,
    orders:tableOrders.map(o=>o.id),
    items:tableOrders.flatMap(o=>o.items.filter(i=>!i.cancelled)),
    total,
    paidAt:now.toISOString(),
    paidTimeStr:now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
  };
  sales.push(saleRecord);
  saveSales(sales);

  // Mark orders as paid
  tableOrders.forEach(o=>{
    const ord=orders.find(x=>x.id===o.id);
    if(ord)ord.status='paid';
  });
  saveOrders(orders);
  
  // Firebase handles cross-device sync
  
  closeTdPopBtn();
  render();
  
  // Show confirmation toast
  showToast('Table '+activeTdTable+' paid ✓  ฿'+total);
}

function showToast(msg){
  let t=document.getElementById('kitchenToast');
  if(!t){t=document.createElement('div');t.id='kitchenToast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--dark3);border:1px solid var(--b2);color:var(--gold-l);padding:10px 20px;border-radius:8px;font-size:13px;transition:transform .3s;z-index:999;pointer-events:none;white-space:nowrap';document.body.appendChild(t);}
  t.textContent=msg;
  t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(()=>{t.style.transform='translateX(-50%) translateY(50px)';},3000);
}

function upd(id,status){
  const orders=loadOrders();
  const o=orders.find(x=>x.id===id);
  if(o){o.status=status;saveOrders(orders);}
  render();
}

// Clock
(function tick(){
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  setTimeout(tick,1000);
})();

document.getElementById('bellBtn').className='bell-btn'+(bellOn?' on':'');
render();
</script>
